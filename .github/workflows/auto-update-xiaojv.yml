name: Auto Update Lucky XiaoJV

on:
  schedule:
    # 每 2 小时自动检查一次 (错开整点高峰以秒级触发，全天候 24 小时自动巡检)
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制重新下载打包发版（即使已是最新版）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check latest XiaoJV Beta on release.66666.host
        id: check_beta
        run: |
          node -e '
          const fs = require("fs");

          async function main() {
            console.log("正在连接 release.66666.host 检查版本...");
            const rootRes = await fetch("https://release.66666.host/");
            const rootText = await rootRes.text();

            let rootDirs = [];
            if (rootText.trim().startsWith("[")) {
              rootDirs = JSON.parse(rootText).filter(d => d.is_dir).map(d => ({ href: d.url, text: d.name }));
            } else {
              const re = /<a\s+[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
              let m;
              while ((m = re.exec(rootText)) !== null) {
                let href = m[1];
                let text = m[2].replace(/<[^>]+>/g, "").trim();
                if (!href.startsWith("?") && !href.startsWith("#") && href !== ".." && text !== "上一层" && text !== "..") {
                  rootDirs.push({ href, text });
                }
              }
            }

            const betaDirs = rootDirs.filter(d => /v\d+\.\d+\.\d+beta/i.test(d.text));
            if (betaDirs.length === 0) {
              throw new Error("未在服务端找到任何 beta 目录！");
            }

            function parseVer(v) {
              const m = v.match(/^v?(\d+)\.(\d+)\.(\d+)(?:beta(\d*))?$/i);
              if (!m) return [0, 0, 0, 0];
              return [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4] || "0")];
            }

            betaDirs.sort((a, b) => {
              const pa = parseVer(a.text);
              const pb = parseVer(b.text);
              for (let i = 0; i < 4; i++) {
                if (pa[i] !== pb[i]) return pa[i] - pb[i];
              }
              return a.text.localeCompare(b.text);
            });

            const latestBeta = betaDirs[betaDirs.length - 1];
            console.log("找到最新 Beta 目录:", latestBeta.text);

            const betaFolder = latestBeta.text;
            const coreVerMatch = betaFolder.match(/^v?(\d+\.\d+\.\d+)/i);
            const coreVersion = coreVerMatch ? coreVerMatch[1] : betaFolder.replace(/^v/, "");

            // 读取子目录
            const betaUrl = new URL(latestBeta.href, "https://release.66666.host/").href;
            const betaRes = await fetch(betaUrl);
            const betaText = await betaRes.text();
            let betaLinks = [];
            if (betaText.trim().startsWith("[")) {
              betaLinks = JSON.parse(betaText).map(d => ({ href: d.url, text: d.name }));
            } else {
              const re = /<a\s+[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
              let m;
              while ((m = re.exec(betaText)) !== null) {
                let href = m[1];
                let text = m[2].replace(/<[^>]+>/g, "").trim();
                if (!href.startsWith("?") && !href.startsWith("#") && href !== ".." && text !== "上一层") {
                  betaLinks.push({ href, text });
                }
              }
            }

            // 匹配纯净 xiaojv 目录 (排除 xiaojv_waf)
            const xiaojvDir = betaLinks.find(l => l.text.includes("xiaojv") && !l.text.includes("waf"));
            if (!xiaojvDir) {
              throw new Error("在 " + betaFolder + " 下未找到纯净 xiaojv 目录！");
            }
            console.log("找到纯净 XiaoJV 目录:", xiaojvDir.text);

            // 获取下载链接
            const dirUrl = new URL(xiaojvDir.href, betaUrl).href;
            const dirRes = await fetch(dirUrl);
            const dirText = await dirRes.text();
            let files = [];
            if (dirText.trim().startsWith("[")) {
              files = JSON.parse(dirText).map(d => ({ href: d.url, text: d.name }));
            } else {
              const re = /<a\s+[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
              let m;
              while ((m = re.exec(dirText)) !== null) {
                let href = m[1];
                let text = m[2].replace(/<[^>]+>/g, "").trim();
                if (!href.startsWith("?") && !href.startsWith("#") && href !== ".." && text !== "上一层") {
                  files.push({ href, text });
                }
              }
            }

            const arm64Item = files.find(l => l.text.includes("Linux_arm64") && l.text.includes("xiaojv") && !l.text.includes("waf") && l.text.endsWith(".tar.gz"));
            const armv7Item = files.find(l => l.text.includes("Linux_armv7") && l.text.includes("xiaojv") && !l.text.includes("waf") && l.text.endsWith(".tar.gz"));

            if (!arm64Item) throw new Error("未找到纯净 XiaoJV 的 Linux_arm64 安装包！");

            const arm64Url = new URL(arm64Item.href, dirUrl).href;
            const armv7Url = armv7Item ? new URL(armv7Item.href, dirUrl).href : "";

            // 读取本地现有版本与构建标识
            let currentVersion = "";
            if (fs.existsSync("lucky/version")) {
              currentVersion = fs.readFileSync("lucky/version", "utf8").trim();
            }

            console.log("远程最新版本:", coreVersion, " (" + betaFolder + ")");
            console.log("本地当前版本:", currentVersion);

            const forceUpdate = process.env.FORCE_UPDATE === "true";
            let needUpdate = forceUpdate || (currentVersion !== coreVersion);
            if (!needUpdate && fs.existsSync("config.json.js")) {
              const conf = JSON.parse(fs.readFileSync("config.json.js", "utf8"));
              if (conf.description && conf.description.includes("WAF")) {
                console.log("检测到本地还是旧的 WAF 版描述，触发更新为纯 XiaoJV 版...");
                needUpdate = true;
              }
            }

            console.log("是否需要更新:", needUpdate);

            const envOut = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(envOut, "need_update=" + needUpdate + "\n");
            fs.appendFileSync(envOut, "version=" + coreVersion + "\n");
            fs.appendFileSync(envOut, "beta_folder=" + betaFolder + "\n");
            fs.appendFileSync(envOut, "arm64_url=" + arm64Url + "\n");
            fs.appendFileSync(envOut, "armv7_url=" + armv7Url + "\n");
          }

          main().catch(err => {
            console.error("执行出错:", err);
            process.exit(1);
          });
          '
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}

      - name: Download, Package and Release
        if: steps.check_beta.outputs.need_update == 'true'
        run: |
          set -e
          VERSION="${{ steps.check_beta.outputs.version }}"
          BETA_FOLDER="${{ steps.check_beta.outputs.beta_folder }}"
          ARM64_URL="${{ steps.check_beta.outputs.arm64_url }}"
          ARMV7_URL="${{ steps.check_beta.outputs.armv7_url }}"

          echo "🚀 开始更新并打包 Lucky v${VERSION} (纯净轻量 XiaoJV 版)..."

          # 1. 准备临时目录
          mkdir -p lucky/bin tmp_download

          # 2. 下载 arm64 内核 (专用于天选 AX6000 MT7986A 64位)
          echo "⬇️ 正在下载 ARM64 内核: $ARM64_URL"
          curl -sSL "$ARM64_URL" -o tmp_download/lucky_arm64.tar.gz
          tar -zxf tmp_download/lucky_arm64.tar.gz -C tmp_download/
          mv tmp_download/lucky tmp_download/lucky_arm64

          # 3. 下载 armv7 内核 (32位兼容)
          if [ -n "$ARMV7_URL" ]; then
            echo "⬇️ 正在下载 ARMv7 内核: $ARMV7_URL"
            curl -sSL "$ARMV7_URL" -o tmp_download/lucky_armv7.tar.gz
            tar -zxf tmp_download/lucky_armv7.tar.gz -C tmp_download/
            mv tmp_download/lucky tmp_download/lucky_armv7
          fi

          # 4. 更新版本号与文件
          echo "$VERSION" > lucky/version

          # 更新 Changelog.txt
          DATE_NOW=$(date +"%Y-%m-%d")
          TMP_LOG=$(mktemp)
          printf "%s\n   - update     从 release.66666.host 自动同步至最新 %s (纯轻量 XiaoJV版, 适配华硕天选AX6000等ARM64机型) [%s]\n\n" "$VERSION" "$BETA_FOLDER" "$DATE_NOW" > "$TMP_LOG"
          if [ -f Changelog.txt ]; then
            cat Changelog.txt >> "$TMP_LOG"
          fi
          mv "$TMP_LOG" Changelog.txt

          # 5. 生成 ARM64 离线安装包 (主安装包)
          cp -f tmp_download/lucky_arm64 lucky/bin/lucky
          chmod +x lucky/bin/lucky lucky/install.sh lucky/uninstall.sh lucky/scripts/*.sh

          # 打包 ARM64 主安装包
          tar --exclude='.git*' --exclude='.github' --exclude='*.tar.gz' \
              --exclude='*.backup' --exclude='tmp_download' -czf "MerlinLucky_v${VERSION}_arm64.tar.gz" lucky/
          cp -f "MerlinLucky_v${VERSION}_arm64.tar.gz" "MerlinLucky_v${VERSION}.tar.gz"
          MD5_ARM64=$(md5sum "MerlinLucky_v${VERSION}.tar.gz" | cut -d' ' -f1)

          # 6. 生成 ARMv7 离线安装包 (兼容包)
          if [ -f tmp_download/lucky_armv7 ]; then
            cp -f tmp_download/lucky_armv7 lucky/bin/lucky
            chmod +x lucky/bin/lucky lucky/install.sh lucky/uninstall.sh lucky/scripts/*.sh
            tar --exclude='.git*' --exclude='.github' --exclude='*.tar.gz' \
                --exclude='*.backup' --exclude='tmp_download' -czf "MerlinLucky_v${VERSION}_armv7.tar.gz" lucky/
            MD5_ARMV7=$(md5sum "MerlinLucky_v${VERSION}_armv7.tar.gz" | cut -d' ' -f1)
          fi

          # 仓库保留 ARM64 的可执行文件
          cp -f tmp_download/lucky_arm64 lucky/bin/lucky
          chmod +x lucky/bin/lucky lucky/install.sh lucky/uninstall.sh lucky/scripts/*.sh

          # 7. 更新 config.json.js
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('config.json.js', 'utf8'));
            conf.version = '${VERSION}';
            conf.md5 = '${MD5_ARM64}';
            conf.description = 'Lucky ${BETA_FOLDER} XiaoJV (纯轻量基础版, 默认ARM64)';
            conf.link = 'https://github.com/mizb/MerlinLucky';
            conf.author = 'vj23456, kiritoknight, mizb';
            fs.writeFileSync('config.json.js', JSON.stringify(conf, null, 4), 'utf8');
          "

          # 8. 提交修改并推送到仓库
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lucky/ config.json.js Changelog.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto update Lucky to v${VERSION} (${BETA_FOLDER} xiaojv)"
            git push origin HEAD:${{ github.ref_name }}
          fi

          # 9. 导出给后续 Release 步骤
          echo "md5_arm64=${MD5_ARM64}" >> $GITHUB_ENV
          echo "md5_armv7=${MD5_ARMV7:-N/A}" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.check_beta.outputs.need_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.check_beta.outputs.version }}"
          name: "MerlinLucky v${{ steps.check_beta.outputs.version }} (XiaoJV 纯轻量版)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 🍭 Lucky ${{ steps.check_beta.outputs.beta_folder }} (XiaoJV 纯轻量版) 梅林离线安装包

            本版本由 GitHub Actions 从官方源 [release.66666.host](https://release.66666.host/) 自动构建打包。

            #### 🚀 本次更新与精简优化重点
            - **文件句柄上限提升**：启动时注入 `ulimit -n 65535`，彻底杜绝高并发穿透与大流量反代时偶发的“Too many open files”断流故障。
            - **日志与闪存保护**：增加日志文件大小自动限制与轮转机制，严格限制在安全阈值以内，保护路由器闪存寿命与内存盘空间。
            - **彻底移除外部守护**：清理冗余的 perp/watchdog 外部守护进程与页面开关，杜绝与 Lucky 原版内部自重启机制发生竞态冲突，统一使用 Linux 原生 start-stop-daemon 托管。
            - **内存深度调优**：启动时注入 GOMEMLIMIT=24MiB 与 MADV_DONTNEED 运行时调优参数，强制 Go 运行时积极归还物理内存，将常驻内存锁定在超低区间，彻底消除内存抖动。
            - **秒级轻量状态查询**：统一 PID 路径，消除前端状态轮询时频繁派生 4 个管道子进程的高开销，路由器 CPU/内存零负担。

            #### 📌 版本特性 (XiaoJV 纯轻量版)
            - **极度精简纯粹**：移除了 WAF 防火墙及 gRPC 等重型组件，专注于最基础、最高效的核心网络功能。
            - **核心网络服务**：全新 3.x Web 服务（支持负载均衡/Unix Socket/域名遮罩）、ACME 证书、DDNS、端口转发、STUN、计划任务、IP 地址库等。
            - **超低资源开销**：常驻内存仅约 15MB ~ 25MB，零冗余开销，超低 CPU 占用。
            - **专属适配机型**：华硕天选 AX6000 (联发科 MT7986A Filogic 830)、GT-AX6000、RT-AX86U 等 64 位及 32 位梅林/官改路由器。

            ---
            #### 📦 安装包下载指南

            1. **`MerlinLucky_v${{ steps.check_beta.outputs.version }}.tar.gz`**（🌟 **华硕天选 AX6000 推荐直接下载此包**）
               - 架构：`Linux_arm64`（联发科 MT7986A 原生 64 位高性能构建）
               - MD5: `${{ env.md5_arm64 }}`

            2. **`MerlinLucky_v${{ steps.check_beta.outputs.version }}_arm64.tar.gz`**
               - 架构：`Linux_arm64`（内容与主安装包完全一致）
               - MD5: `${{ env.md5_arm64 }}`

            3. **`MerlinLucky_v${{ steps.check_beta.outputs.version }}_armv7.tar.gz`**
               - 架构：`Linux_armv7`（老款 32 位 ARM 路由器兼容备用）
               - MD5: `${{ env.md5_armv7 }}`

            ---
            #### ⚠️ 升级须知
            - 升级前请在 Lucky 原后台的“系统设置 / 模块管理”中，将配置导出为 `.lkcf` 备份文件妥善保存。
            - 下载对应压缩包后，进入梅林后台：**软件中心 -> 离线安装** 上传安装包即可。
          files: |
            MerlinLucky_*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
